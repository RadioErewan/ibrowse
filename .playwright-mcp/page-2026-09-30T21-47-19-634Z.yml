  - heading "The three pieces" [level=2] [ref=f1e35]
  - list [ref=f1e36]:
    - listitem [ref=f1e37]:
      - strong [ref=f1e38]: Lightbrary for Mac
      - text: "— the full workspace: filters, grid, preview and metadata side by side."
      - link "Download" [ref=f1e39] [cursor=pointer]:
        - /url: /download
      - text: .
    - listitem [ref=f1e40]:
      - strong [ref=f1e41]: Lightbrary for iPhone
      - text: "— the same library in your pocket: rate with a swipe, pair up bursts, clear out what you marked."
      - link "Install through TestFlight" [ref=f1e42] [cursor=pointer]:
        - /url: https://testflight.apple.com/join/8tNNanJ3
      - text: .
    - listitem [ref=f1e43]:
      - strong [ref=f1e44]: Lightbrary Exporter
      - text: — a small menu-bar helper for the Mac that holds your photo library. It hands both apps the measures, search words and metadata Photos has worked out.
      - link "Download" [ref=f1e45] [cursor=pointer]:
        - /url: /download#exporter
      - text: .
  - paragraph [ref=f1e46]: You do not need all three. Each app works on its own for browsing, rating and pairing up; measures and search arrive once the Exporter runs on the Mac that holds your library.
  - heading "Setting up" [level=2] [ref=f1e47]
  - list [ref=f1e48]:
    - listitem [ref=f1e49]:
      - strong [ref=f1e50]: Allow photo access
      - text: on each device when the app asks. Choose full access — with limited access the app only sees the photos you picked.
    - listitem [ref=f1e51]:
      - strong [ref=f1e52]: Choose a shared folder
      - text: "on each device: the sync button ("
      - emphasis [ref=f1e53]: circular arrows
      - text: ) →
      - emphasis [ref=f1e54]: choose shared folder…
      - text: on the Mac,
      - emphasis [ref=f1e55]: ••• → Sync
      - text: on the iPhone. Make a folder in iCloud Drive and pick
      - strong [ref=f1e56]: the same one
      - text: everywhere, including in the Exporter.
    - listitem [ref=f1e57]:
      - strong [ref=f1e58]: For measures and search, install the Exporter
      - text: on the Mac that holds your library — see
      - link "below" [ref=f1e59] [cursor=pointer]:
        - /url: "#exporter"
      - text: . Both apps take them from the shared folder.
  - heading "The Mac window" [level=2] [ref=f1e60]
  - paragraph [ref=f1e61]:
    - text: "Three columns:"
    - strong [ref=f1e62]: filters
    - text: on the left, the
    - strong [ref=f1e63]: grid
    - text: in the middle, the
    - strong [ref=f1e64]: preview
    - text: of the selected photo with its metadata on the right. The grid and the full-screen view walk the same list in the same order, so whatever you filter and sort is exactly what you rate. Click a person, place or scene in the metadata to show every photo with it.
  - figure "Filters on the left, the grid in the middle, the selected photo on the right." [ref=f1e65]:
    - 'img "The Mac window: filters, grid and preview." [ref=f1e66]'
  - list [ref=f1e68]:
    - listitem [ref=f1e69]:
      - strong [ref=f1e70]: Double-click
      - text: a photo, or press return / space, to open it full screen. esc brings you back to the same place in the grid.
    - listitem [ref=f1e71]:
      - text: The toolbar holds the modes (
      - emphasis [ref=f1e72]: grid
      - text: ","
      - emphasis [ref=f1e73]: pair up
      - text: ), the filter summary, sync,
      - emphasis [ref=f1e74]: compute fingerprints
      - text: and the
      - emphasis [ref=f1e75]: to delete
      - text: counter.
    - listitem [ref=f1e76]:
      - strong [ref=f1e77]: Reload Library
      - text: (⌘R) picks up photos that arrived from iCloud if the list looks stale. Normally the list follows your library by itself.
    - listitem [ref=f1e78]:
      - strong [ref=f1e79]: Check for Updates…
      - text: in the app menu tells you when a new version is on the site.
  - heading "Rating" [level=2] [ref=f1e80]
  - paragraph [ref=f1e81]:
    - text: Every photo has one
    - strong [ref=f1e82]: weight
    - text: "from 0 to 5. Stars are just that weight rounded. Everything writes to the same number:"
  - 'figure "Full screen: the photo, the strip of neighbours below, the metadata beside it." [ref=f1e83]':
    - img "Full-screen rating on the Mac with metadata beside the photo." [ref=f1e84]
  - figure "The 1:1 loupe follows the cursor; click to freeze it." [ref=f1e86]:
    - img "The 1:1 loupe over a photo on the Mac." [ref=f1e87]
  - list [ref=f1e89]:
    - listitem [ref=f1e90]:
      - strong [ref=f1e91]: Digits
      - text: "set it directly: 1–5, and 0 for “looked at, no good”. The view moves on to the next photo."
    - listitem [ref=f1e92]:
      - strong [ref=f1e93]: Nudging
      - text: "moves it by a quarter of a star and stays put: +/− on the Mac, swipe up/down on the iPhone. Four nudges are one star, so a doubtful call is easy to take back."
    - listitem [ref=f1e94]:
      - strong [ref=f1e95]: Pair up
      - text: moves the winner up and the loser down — more when the result is a surprise, less when it was expected.
  - paragraph [ref=f1e96]:
    - text: The stars also land
    - strong [ref=f1e97]: in Photos itself
    - text: ", and a star you change in Photos comes back into Lightbrary. Photos keeps the whole star; the quarter-star detail and how many times you judged a photo travel through the shared folder."
