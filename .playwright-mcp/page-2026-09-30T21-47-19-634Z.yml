  - paragraph [ref=f1e169]:
    - text: "Modes sit in the tab bar at the bottom:"
    - strong [ref=f1e170]: grid
    - text: ","
    - strong [ref=f1e171]: rate
    - text: and
    - strong [ref=f1e172]: pair up
