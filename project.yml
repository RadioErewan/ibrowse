name: lightbrary
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

options:
  bundleIdPrefix: pl.3210
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.2"
    # Każde wgranie do App Store Connect musi mieć **inny** numer buildu.
    # Podnieś przed wysyłką; wersja marketingowa zmienia się rzadziej.
    CURRENT_PROJECT_VERSION: "3"

targets:
  lightbrary-mac:
    type: application
    platform: macOS
    # Każda platforma ma własny katalog zasobów, bo ikona to na Macu rysunek
    # z marginesem, a na iOS kadr wypełniony do krawędzi. Wspólny katalog
    # dawałby na telefonie ikonę w białej ramce.
    sources:
      - Sources
      - path: Resources/Mac.xcassets
        optional: true
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Generated/Info-mac.plist
      properties:
        CFBundleDisplayName: lightbrary
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # Bez tego klucza system nie pokaże pytania o dostęp do biblioteki.
        NSPhotoLibraryUsageDescription: >-
          lightbrary czyta bibliotekę zdjęć, żeby pozwolić Ci je przeglądać,
          oceniać i usuwać. Nic nie jest wysyłane poza ten komputer.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.3210.lightbrary
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        # Podpisujemy prawdziwym certyfikatem, choć aplikacja nie opuszcza tego
        # komputera. Powód jest jeden: **Pełny dostęp do dysku**. Zgoda TCC
        # zapamiętuje tożsamość podpisu, a podpis doraźny zmienia się przy każdej
        # kompilacji — trzeba by nadawać uprawnienie po każdej przebudowie.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: $(LIGHTBRARY_TEAM_ID)
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Uprawnienia tylko w wydaniu, bo tylko tam włączamy hardened runtime.
        # Codzienna kompilacja deweloperska podpisuje się bez nich i nic jej
        # nie brakuje — patrz komentarz w samym pliku uprawnień.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/lightbrary-mac.entitlements

  lightbrary-ios:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/iOS.xcassets
        optional: true
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Generated/Info-ios.plist
      properties:
        CFBundleDisplayName: lightbrary
        # Bez tego App Store Connect pyta o szyfrowanie przy każdym wgraniu
        # i build wisi, dopóki nie odpowiesz ręcznie. Aplikacja nie ma własnej
        # kryptografii ani sieci, więc odpowiedź brzmi „nie".
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: >-
          lightbrary czyta bibliotekę zdjęć, żeby pozwolić Ci je przeglądać,
          oceniać i usuwać. Nic nie jest wysyłane poza to urządzenie.
    settings:
      base:
        # Identyfikator musi być unikalny w skali Apple — przy darmowym koncie
        # kolizja z cudzą aplikacją objawia się odmową rejestracji App ID.
        PRODUCT_BUNDLE_IDENTIFIER: pl.3210.lightbrary
        TARGETED_DEVICE_FAMILY: "1,2"
        # Podpisywanie automatyczne: Xcode sam wyrobi profil dla Personal Team.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(LIGHTBRARY_TEAM_ID)
        # Podpis jest potrzebny tylko do wejścia na fizyczny telefon.
        # Symulator ma działać zawsze, także zanim skonfigurujesz Apple ID.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
