name: lightbrary
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

options:
  bundleIdPrefix: pl.3210
  # Angielski jest językiem źródłowym: napisy w kodzie są po angielsku, a polski
  # jest przekładem w katalogu. Tak apka idzie za językiem systemu, a nieznany
  # język dostaje angielski, nie polski.
  developmentLanguage: en
  # macOS 27 / iOS 27 celowo, nie zaniedbanie. `PHAsset.rating` — prawdziwa,
  # zapisywalna, natywnie synchronizowana gwiazdka — wymaga dokładnie tego:
  # API_AVAILABLE(macos(27), ios(27)) w nagłówkach SDK. Decyzja świadoma
  # kosztu: apka jest betą bez planu monetyzacji, więc dług techniczny po to,
  # by wspierać starsze systemy, nie ma czego dziś kupować. macOS 27 „Golden
  # Gate" jest przy tym wyłącznie dla Apple Silicon — Intela odcina sam system,
  # zanim odetnie go nasz wybór.
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.15"
    # Każde wgranie do App Store Connect musi mieć **inny** numer buildu.
    # Podnieś przed wysyłką; wersja marketingowa zmienia się rzadziej.
    CURRENT_PROJECT_VERSION: "18"

targets:
  lightbrary-mac:
    type: application
    platform: macOS
    # Każda platforma ma własny katalog zasobów, bo ikona to na Macu rysunek
    # z marginesem, a na iOS kadr wypełniony do krawędzi. Wspólny katalog
    # dawałby na telefonie ikonę w białej ramce.
    sources:
      # Eksporter ma własny `@main` i własny program — patrz cel niżej.
      - path: Sources
        excludes:
          - Exporter/**
      - path: Resources/Mac.xcassets
        optional: true
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Localizable.xcstrings
    info:
      path: Generated/Info-mac.plist
      properties:
        CFBundleDisplayName: lightbrary
        # Bez tych dwóch xcodegen wpisuje własne domyślne "1.0"/"1" jako
        # zwykły tekst, a Xcode podmienia w Info.plist tylko to, co wygląda
        # jak $(ZMIENNA) — dosłowny napis zostaje nietknięty. Efekt: każde
        # dotychczasowe wydanie miało w środku "1.0 (1)" niezależnie od tego,
        # co pokazywała nazwa pliku DMG, a "Sprawdź aktualizacje" porównywało
        # zawsze tę samą, martwą liczbę. Odkryte przy czytaniu crash reportu —
        # slice_uuid zgadzał się z naszą świeżą binarką, ale app_version
        # uparcie pokazywał "1.0".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "27.0"
        NSHumanReadableCopyright: ""
        # Bez tego klucza system nie pokaże pytania o dostęp do biblioteki.
        NSPhotoLibraryUsageDescription: >-
          lightbrary czyta bibliotekę zdjęć, żeby pozwolić Ci je przeglądać,
          oceniać i usuwać. Nic nie jest wysyłane poza ten komputer.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.3210.lightbrary
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        # Podpisujemy prawdziwym certyfikatem, choć aplikacja nie opuszcza tego
        # komputera. Powód jest jeden: **Pełny dostęp do dysku**. Zgoda TCC
        # zapamiętuje tożsamość podpisu, a podpis doraźny zmienia się przy każdej
        # kompilacji — trzeba by nadawać uprawnienie po każdej przebudowie.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: $(LIGHTBRARY_TEAM_ID)
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Uprawnienia tylko w wydaniu, bo tylko tam włączamy hardened runtime.
        # Codzienna kompilacja deweloperska podpisuje się bez nich i nic jej
        # nie brakuje — patrz komentarz w samym pliku uprawnień.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/lightbrary-mac.entitlements

  lightbrary-ios:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Exporter/**
      - path: Resources/iOS.xcassets
        optional: true
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Localizable.xcstrings
    info:
      path: Generated/Info-ios.plist
      properties:
        CFBundleDisplayName: lightbrary
        # Jak w celu na macOS — bez tego xcodegen wpisuje dosłowne "1.0"/"1".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Bez tego App Store Connect pyta o szyfrowanie przy każdym wgraniu
        # i build wisi, dopóki nie odpowiesz ręcznie. Aplikacja nie ma własnej
        # kryptografii ani sieci, więc odpowiedź brzmi „nie".
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Wszystkie cztery, nie trzy — App Store odrzuca upload bez
        # UpsideDown, bo bez niego iPad nie obsługuje multitaskingu.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: >-
          lightbrary czyta bibliotekę zdjęć, żeby pozwolić Ci je przeglądać,
          oceniać i usuwać. Nic nie jest wysyłane poza to urządzenie.
    settings:
      base:
        # Identyfikator musi być unikalny w skali Apple — przy darmowym koncie
        # kolizja z cudzą aplikacją objawia się odmową rejestracji App ID.
        PRODUCT_BUNDLE_IDENTIFIER: pl.3210.lightbrary
        TARGETED_DEVICE_FAMILY: "1,2"
        # Podpisywanie automatyczne: Xcode sam wyrobi profil dla Personal Team.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(LIGHTBRARY_TEAM_ID)
        # Podpis jest potrzebny tylko do wejścia na fizyczny telefon.
        # Symulator ma działać zawsze, także zanim skonfigurujesz Apple ID.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Eksporter: mała aplikacja w pasku menu, poza sklepem, open source.
  # Czyta bazy Photos (Pełny dostęp do dysku) i pisze plik `-features` do
  # folderu wymiany. W tym samym repozytorium co przeglądarki, a nie osobnym,
  # bo format pliku (`SyncFile`) to kontrakt między nimi — jeden plik źródłowy
  # zamiast dwóch kopii, które prędzej czy później się rozjadą.
  lightbrary-exporter:
    type: application
    platform: macOS
    sources:
      - Sources/Exporter
      - Sources/Metadata/MetadataStore.swift
      - Sources/Model/Measure.swift
      - Sources/Model/HalfFloat.swift
      - Sources/Sync/SyncFile.swift
      - Sources/Sync/SyncFolder.swift
      - Sources/Sync/CloudIdentity.swift
      # Ikona od designera: dokument z tęczowym paskiem i znak pasowania
      # z ikony lightbrary. Źródło 1024 px: Resources/exporter-icon-source.png.
      - Resources/Exporter.xcassets
    info:
      path: Generated/Info-exporter.plist
      properties:
        CFBundleDisplayName: lightbrary exporter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "27.0"
        # Tylko w pasku menu, bez ikony w Docku.
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSPhotoLibraryUsageDescription: >-
          lightbrary exporter lists your photos to match them with the measures
          it reads from the library databases. It never changes your library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.3210.lightbrary.exporter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "NO"
        # Prawdziwy podpis z tego samego powodu co w przeglądarce na Macu:
        # zgoda na Pełny dostęp do dysku pamięta tożsamość podpisu.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: $(LIGHTBRARY_TEAM_ID)
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/lightbrary-mac.entitlements
